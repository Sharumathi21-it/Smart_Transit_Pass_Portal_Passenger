var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

  //---------------------------------------------------------------------
  // QRUtil
  //---------------------------------------------------------------------

  var QRUtil = function() {

    var PATTERN_POSITION_TABLE = [
      [],
      [6, 18],
      [6, 22],
      [6, 26],
      [6, 30],
      [6, 34],
      [6, 22, 38],
      [6, 24, 42],
      [6, 26, 46],
      [6, 28, 50],

  const start = new Date(); start.setDate(start.getDate() - Math.floor(Math.random()*daysBack));

function fmtDate(d) { return d.toISOString().split('T')[0]; }

// ══════════════════════════════════════════════════════════
// CURRENCY FORMATTING
// ══════════════════════════════════════════════════════════
// fmtINR: for on-screen HTML — browsers render the ₹ (U+20B9) glyph correctly.
// fmtPdfRs: for jsPDF-generated PDFs — jsPDF's built-in standard fonts (Helvetica)
// do NOT support the ₹ glyph, which previously produced corrupted output like
// "!6&0&0" in downloaded PDFs. "Rs." is used instead so amounts always render
// correctly inside every generated PDF (Bus Pass, Receipt, Profile, etc.)
function fmtINR(amount) {
  const n = Number(amount);
  return '₹' + (isNaN(n) ? (amount===undefined||amount===null||amount===''?'0':amount) : n.toLocaleString('en-IN'));
}
function fmtPdfRs(amount) {
  const n = Number(amount);
  return 'Rs. ' + (isNaN(n) ? (amount===undefined||amount===null||amount===''?'0':amount) : n.toLocaleString('en-IN'));
}

function lsGet(key) { try { return JSON.parse(localStorage.getItem('st_'+key)||'null'); } catch(e){return null;} }
function lsSet(key,val) { try { localStorage.setItem('st_'+key, JSON.stringify(val)); } catch(e){} }

function syncPassengersToLS() { lsSet('passengers', PASSENGERS); }
function syncStaffToLS() { lsSet('staff', STAFF); }
// Persist signup users separately so they survive page refresh
function lsGetSignups() { try { return JSON.parse(localStorage.getItem('st_signups')||'[]'); } catch(e){return[];} }
function lsSetSignups(arr) { try { localStorage.setItem('st_signups', JSON.stringify(arr)); } catch(e){} }

function loadFromLS() {
  // Load passengers from LS (only if persisted)
  const p = lsGet('passengers'); if(p&&p.length) { PASSENGERS.length=0; PASSENGERS.push(...p); p.forEach(x=>{USERS_DB[x.email]=x;}); }
  const s = lsGet('staff'); if(s&&s.length) { STAFF.length=0; STAFF.push(...s); s.forEach(x=>{USERS_DB[x.email]=x;}); }
  // Restore signup users into USERS_DB always
  const signups = lsGetSignups();
  signups.forEach(u => {
    USERS_DB[u.email] = u;
    if(u.role==='passenger' && !PASSENGERS.find(x=>x.email===u.email)) PASSENGERS.push(u);
    else if(u.role==='staff' && !STAFF.find(x=>x.email===u.email)) STAFF.push(u);
  });
  // Always ensure admin and demo accounts work
  USERS_DB['admin@smarttransit.in'] = ADMIN;
}

// ══════════════════════════════════════════════════════════
// QR CODE GENERATION
// ══════════════════════════════════════════════════════════
function getValidationURL(id, vtype='passenger') {
  // QR stores a compact, human-readable KEY:VALUE string — NOT JSON and NOT a URL.
  // This means that scanning a SmartTransit pass with ANY camera / QR reader app
  // (not just this portal) shows clean readable text such as
  // "PASS:BP001|PID:P001|NAME:Sharumathi M|FROM:2026-01-01|TO:2026-12-31|STATUS:ACTIVE"
  // instead of a raw JSON blob. The in-app scanner (_handleScannedQR) parses this
  // format and always renders a fully formatted pass card — never the raw string.
  if(vtype==='passenger'){
    const p=PASSENGERS.find(x=>x.passNumber===id);
    if(p){
      const status=p.passActive&&new Date(p.passTo)>=new Date()?'ACTIVE':'EXPIRED';
      return `PASS:${p.passNumber}|PID:${p.id}|NAME:${p.name}|FROM:${p.passFrom}|TO:${p.passTo}|STATUS:${status}`;
    }
  }
  if(vtype==='staff'){
    const s=STAFF.find(x=>x.id===id);
    if(s){
      return `STAFF:${s.id}|NAME:${s.name}|DESIGNATION:${s.designation||'—'}|ZONE:${s.zone||'—'}|SHIFT:${s.shift||'—'}|STATUS:ON DUTY`;
    }
  }
  if(vtype==='admin'){
    const a=(ADMIN.id===id)?ADMIN:null;
    if(a){
      return `ADMIN:${a.id}|NAME:${a.name}|DESIGNATION:${a.designation||'Administrator'}|ACCESS:${a.accessLevel||'Full System Access'}|STATUS:ACTIVE`;
    }
  }
  // Fallback: minimal compact string with just the ID
  return `PASS:${id}|PID:${id}|STATUS:UNKNOWN`;
}

// Parses the compact "KEY:VALUE|KEY:VALUE" QR format used by SmartTransit passes.
// Returns null if the string doesn't look like our compact format (so callers can
// fall back to legacy JSON / URL parsing for backward compatibility).
function parseCompactQRData(raw){
  if(typeof raw!=='string') return null;
  const str=raw.trim();
  if(!str.includes(':')) return null;
  const out={};
  let pairs=0;
  str.split('|').forEach(seg=>{
    const i=seg.indexOf(':');
    if(i===-1) return;
    const key=seg.slice(0,i).trim().toUpperCase();
    const val=seg.slice(i+1).trim();
    if(key){ out[key]=val; pairs++; }
  });
  return pairs>0 ? out : null;
}
function makeQRDataURL(text, size) {
  try {
    var qr = qrcode(0, 'M');
    qr.addData(text);
    qr.make();
    var count = qr.getModuleCount();
    var cellSize = Math.floor(size / (count + 4));
    var margin = Math.floor((size - count * cellSize) / 2);
    var canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#0d1428';
    ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = '#ffffff';
    for (var row = 0; row < count; row++) {
      for (var col = 0; col < count; col++) {
        if (qr.isDark(row, col)) {
          ctx.fillRect(margin + col * cellSize, margin + row * cellSize, cellSize, cellSize);
        }
      }
    }
    return canvas.toDataURL('image/png');
  } catch(e) { console.warn('QR gen error:', e); return ''; }
}
function renderQR(elId, passNumber, size=120) {
  const el=document.getElementById(elId);
  if(!el) return;
  const url = makeQRDataURL(getValidationURL(passNumber), size);
  if(url) el.src = url;
}
function renderAllQRCodes() {
  // Passenger pass QR — now correctly encodes the full validation URL
  // (previously encoded the raw pass number, which is why scanning only showed the ID)
  document.querySelectorAll('[data-qr-pass]').forEach(img=>{
    const pn = img.dataset.qrPass;
    const size = parseInt(img.dataset.qrSize||'100');

  // Staff ID QR

}

pages['p-journey']=()=>`
<div class="page-header"><div><div class="page-title">Route Search & Booking</div><div class="page-sub">Find and book routes across Chennai</div></div></div>
<div class="card">
  <div class="form-row">
    <div class="form-group"><label class="form-label">From</label><input class="form-input" id="jpFrom" placeholder="Start stop" value="${currentUser.route?ROUTES_DATA.find(r=>r.num===currentUser.route)?.from||'Anna Nagar':'Anna Nagar'}"></div>
    <div class="form-group"><label class="form-label">To</label><input class="form-input" id="jpTo" placeholder="Destination stop" value="T. Nagar"></div>
  </div>
  <div class="form-row">
    <div class="form-group"><label class="form-label">Date</label><input class="form-input" type="date" id="jpDate" value="${fmtDate(new Date())}"></div>
    <div class="form-group"><label class="form-label">Time</label><input class="form-input" type="time" id="jpTime" value="09:00"></div>
  </div>
  <button class="btn-sm btn-accent" onclick="searchRoutes()" style="padding:11px 28px"><i class="ti ti-search"></i> Find Routes</button>
</div>
<div id="routeResults">
  <div class="card">
    <div class="card-title">All Available Routes</div>
    ${ROUTES_DATA.slice(0,8).map(r=>`
    <div style="border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:16px;">
      <div class="route-num" style="background:rgba(79,142,247,0.12);color:var(--blue);min-width:40px">${r.num}</div>
      <div style="flex:1"><div style="font-size:13px;font-weight:600">${r.name}</div><div style="font-size:12px;color:var(--text2)">${r.stops.length} stops · Every ${r.freq} · ${r.km} km</div></div>
      <div style="text-align:right"><div style="font-size:18px;font-weight:700;color:var(--teal)">₹${r.fare}</div></div>
      <button class="btn-sm btn-accent" onclick="bookRoute('${r.id}')"><i class="ti ti-ticket"></i> Book</button>
    </div>`).join('')}
  </div>
</div>`;

function searchRoutes(){
  const from=document.getElementById('jpFrom').value.toLowerCase();
  const to=document.getElementById('jpTo').value.toLowerCase();
  const matching=ROUTES_DATA.filter(r=>r.from.toLowerCase().includes(from)||r.to.toLowerCase().includes(to)||r.stops.some(s=>s.toLowerCase().includes(from)||s.toLowerCase().includes(to)));
  const container=document.getElementById('routeResults');
  if(!container)return;
  container.innerHTML=`<div class="card"><div class="card-title">Search Results (${matching.length})</div>${matching.length?matching.map(r=>`<div style="border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:16px;"><div class="route-num" style="background:rgba(79,142,247,0.12);color:var(--blue);min-width:40px">${r.num}</div><div style="flex:1"><div style="font-size:13px;font-weight:600">${r.name}</div><div style="font-size:12px;color:var(--text2)">${r.stops.length} stops · Every ${r.freq} · ${r.km} km</div></div><div style="text-align:right"><div style="font-size:18px;font-weight:700;color:var(--teal)">₹${r.fare}</div></div><button class="btn-sm btn-accent" onclick="bookRoute('${r.id}')"><i class="ti ti-ticket"></i> Book</button></div>`).join(''):'<div style="text-align:center;padding:40px;color:var(--text3)">No routes found</div>'}</div>`;
}
function bookRoute(routeId){
  const r=ROUTES_DATA.find(x=>x.id===routeId);
  if(!r)return;
  showModal(`<div class="modal-title">Book Route ${r.num}<button class="modal-close" onclick="closeModal()">✕</button></div>
<div class="card" style="background:var(--bg3);border-color:var(--border)"><div style="font-size:16px;font-weight:700;margin-bottom:8px">${r.name}</div><div style="font-size:13px;color:var(--text2)">${r.stops.length} stops · ₹${r.fare} · ${r.freq}</div></div>
<div class="form-group"><label class="form-label">Journey Date</label><input class="form-input" type="date" id="bkDate" value="${fmtDate(new Date())}"></div>
<div class="form-group"><label class="form-label">Departure Stop</label><select class="form-input">${r.stops.map(s=>`<option>${s}</option>`).join('')}</select></div>
<div class="form-group"><label class="form-label">Destination Stop</label><select class="form-input">${[...r.stops].reverse().map(s=>`<option>${s}</option>`).join('')}</select></div>
<div style="display:flex;justify-content:space-between;align-items:center;padding:14px;background:rgba(79,142,247,0.08);border-radius:8px;margin-bottom:16px"><span style="color:var(--text2)">Fare</span><span style="font-size:20px;font-weight:700;color:var(--teal)">₹${r.fare}</span></div>
<button class="btn-sm btn-accent" style="width:100%;justify-content:center" onclick="confirmBooking('${r.id}')"><i class="ti ti-check"></i> Confirm Booking</button>`);
}
function confirmBooking(routeId){
  const r=ROUTES_DATA.find(x=>x.id===routeId);
  const th={id:'TH'+Date.now(),passId:currentUser.id,passengerName:currentUser.name,routeNum:r.num,routeName:r.name,from:r.from,to:r.to,date:fmtDate(new Date()),time:new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true}),fare:r.fare,status:'Completed',passNumber:currentUser.passNumber};
  TRAVEL_HISTORY.unshift(th);
  closeModal();
  alert(`✅ Booking confirmed for Route ${r.num}! Fare: ₹${r.fare}`);
}

pages['p-routemap']=()=>`
<div class="page-header"><div><div class="page-title">Route Map & Timings</div><div class="page-sub">Visual route stops with departure timings</div></div></div>
<div class="card" style="margin-bottom:16px">

        ${ROUTES_DATA.map(r=>`<option value="${r.id}" ${r.id===currentUser.routeId?'selected':''}>${r.num} — ${r.name}</option>`).join('')}
      </select>
    </div>
    <div style="min-width:120px;padding-top:18px">
      <div id="rmRouteBadge" style="font-size:22px;font-weight:800;text-align:center;color:var(--blue)"></div>
    </div>
  </div>
</div>
<div class="grid-2">
  <div class="card">
    <div class="card-title">Route Visualization</div>
    <div id="routeMapViz"></div>
    <div id="routeMapStats" style="margin-top:12px"></div>
  </div>
  <div class="card">
    <div class="card-title">Stop Schedule — AM/PM Timings</div>
    <div id="routeStopsList"></div>
  </div>
</div>`;

function updateRouteMap(routeId){
  const r=ROUTES_DATA.find(x=>x.id===routeId);
  if(!r)return;
  const badge=document.getElementById('rmRouteBadge');
  if(badge)badge.textContent=r.num;

  // Route visualization
  const vizEl=document.getElementById('routeMapViz');
  if(vizEl){
    vizEl.innerHTML=`
      <div style="font-size:13px;font-weight:600;color:var(--text2);margin-bottom:14px">${r.from} → ${r.to}</div>
      <div style="overflow-x:auto;padding-bottom:8px">
        <div style="display:flex;align-items:center;min-width:max-content;gap:0;padding:8px 4px">
          ${r.stops.map((stop,i)=>`
            <div style="display:flex;align-items:center;gap:0">
              <div style="display:flex;flex-direction:column;align-items:center;gap:6px;min-width:64px">
                <div style="width:${i===0||i===r.stops.length-1?'16px':'12px'};height:${i===0||i===r.stops.length-1?'16px':'12px'};border-radius:50%;background:${i===0?'var(--teal)':i===r.stops.length-1?'var(--blue)':'var(--blue)'};border:${i===0||i===r.stops.length-1?'3px solid var(--teal)':'2px solid rgba(79,142,247,0.5)'};flex-shrink:0;box-shadow:${i===0||i===r.stops.length-1?'0 0 8px rgba(46,232,192,0.5)':'none'}"></div>
                <div style="font-size:9px;color:var(--text2);text-align:center;line-height:1.2;max-width:58px">${stop}</div>
              </div>
              ${i<r.stops.length-1?`<div style="width:32px;height:2px;background:linear-gradient(90deg,var(--blue),rgba(79,142,247,0.3));margin-bottom:20px;flex-shrink:0"></div>`:''}
            </div>
          `).join('')}
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--text3)">
        <span>🟢 Origin: ${r.from}</span>
        <span>🔵 Terminus: ${r.to}</span>
      </div>`;
  }

  // Stats
  const statsEl=document.getElementById('routeMapStats');
  if(statsEl){
    statsEl.innerHTML=`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
      <div style="background:var(--bg3);border-radius:8px;padding:10px;text-align:center"><div style="font-size:9px;color:var(--text3);text-transform:uppercase">Route No.</div><div style="font-size:16px;font-weight:800;color:var(--blue);margin-top:3px">${r.num}</div></div>
      <div style="background:var(--bg3);border-radius:8px;padding:10px;text-align:center"><div style="font-size:9px;color:var(--text3);text-transform:uppercase">Frequency</div><div style="font-size:13px;font-weight:700;margin-top:3px">${r.freq}</div></div>
      <div style="background:var(--bg3);border-radius:8px;padding:10px;text-align:center"><div style="font-size:9px;color:var(--text3);text-transform:uppercase">Distance</div><div style="font-size:16px;font-weight:800;color:var(--teal);margin-top:3px">${r.km} km</div></div>
      <div style="background:var(--bg3);border-radius:8px;padding:10px;text-align:center"><div style="font-size:9px;color:var(--text3);text-transform:uppercase">Fare</div><div style="font-size:16px;font-weight:800;color:var(--green);margin-top:3px">₹${r.fare}</div></div>
    </div>`;
  }

  // Stops & Timings with full AM/PM schedule
  const stopsEl=document.getElementById('routeStopsList');
  if(stopsEl){
    // Generate AM first departure (6:00 AM) and PM last departure (10:00 PM) schedules
    const amBase=new Date(); amBase.setHours(6,0,0,0);
    const pmBase=new Date(); pmBase.setHours(14,30,0,0);
    const intervalMin=Math.floor((r.km/r.stops.length)*3);

    const stopRows=r.stops.map((stop,i)=>{
      const amTime=new Date(amBase.getTime()+(i*intervalMin*60000));
      const pmTime=new Date(pmBase.getTime()+(i*intervalMin*60000));
      const amStr=amTime.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});
      const pmStr=pmTime.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});
      const isMajor=i===0||i===r.stops.length-1;
      const isHalf=i===Math.floor(r.stops.length/2);
      return `
      <div style="display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--border)">
        <div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0;margin-top:2px">
          <div style="width:${isMajor?'14px':'10px'};height:${isMajor?'14px':'10px'};border-radius:50%;background:${i===0?'var(--teal)':isMajor?'var(--blue)':'rgba(79,142,247,0.5)'};border:${isMajor?'2px solid var(--teal)':'1px solid rgba(79,142,247,0.3)'}"></div>
          ${i<r.stops.length-1?`<div style="width:2px;height:18px;background:rgba(79,142,247,0.2);margin-top:3px"></div>`:''}
        </div>
        <div style="flex:1">
          <div style="font-size:12px;font-weight:${isMajor?'700':'500'};color:${isMajor?'var(--text)':'var(--text2)'}">${stop}${isMajor?` <span style="font-size:9px;background:${i===0?'rgba(46,232,192,0.15)':'rgba(79,142,247,0.15)'};color:${i===0?'var(--teal)':'var(--blue)'};padding:1px 6px;border-radius:8px">${i===0?'ORIGIN':'TERMINUS'}</span>`:''}${isHalf?` <span style="font-size:9px;background:rgba(240,169,64,0.15);color:var(--amber);padding:1px 6px;border-radius:8px">MID</span>`:''}
          </div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-size:11px;color:var(--teal);font-weight:600">${amStr}</div>
          <div style="font-size:10px;color:var(--text3)">${pmStr}</div>
        </div>
      </div>`;
    }).join('');

    stopsEl.innerHTML=`
      <div style="display:flex;justify-content:space-between;margin-bottom:10px;font-size:11px">
        <span style="color:var(--teal);font-weight:600">🌅 AM Departure</span>
        <span style="color:var(--text3)">🌆 PM Departure</span>
      </div>
      ${stopRows}
      <div style="margin-top:12px;padding:8px;background:rgba(79,142,247,0.06);border-radius:8px;font-size:11px;color:var(--text3)">
        ℹ️ First bus: 06:00 AM · Last bus: ~10:00 PM · Every ${r.freq}
      </div>`;
  }
}

let selectedPassTypeId = null;
let selectedPayMethodEl = null;
function selectPassType(ptId,el){
  selectedPassTypeId=ptId;
  document.querySelectorAll('#mainContent .pay-method').forEach(e=>e.classList.remove('selected'));
  el.classList.add('selected');
  const pt=PASS_TYPES.find(x=>x.id===ptId);
  if(pt&&document.getElementById('selPassName')){document.getElementById('selPassName').textContent=pt.name;document.getElementById('selPassPrice').textContent='₹'+pt.price;}
}
function selectPayMethod(el){
  document.querySelectorAll('#payMethods .pay-method').forEach(e=>e.classList.remove('selected'));
  el.classList.add('selected');
}
async function processPayment(){
  const ptId=selectedPassTypeId||currentUser.passType;
  const pt=PASS_TYPES.find(x=>x.id===ptId)||PASS_TYPES[0];
  const methodEl=document.querySelector('#payMethods .pay-method.selected');
  const method=methodEl?methodEl.dataset.method:'UPI';
  const payId='PAY'+Date.now().toString(36).toUpperCase();
  const txnId='TXN'+Date.now().toString(36).toUpperCase();
  const newPay={id:payId,passId:currentUser.id,passengerName:currentUser.name,passType:pt.name,amount:pt.price,method,date:fmtDate(new Date()),status:'Success',txnId};
  PAYMENTS.unshift(newPay);
  // Update pass
  const fromDt=new Date(); const toDt=new Date(); toDt.setDate(toDt.getDate()+pt.duration);
  currentUser.passType=pt.id; currentUser.passTypeName=pt.name; currentUser.passFrom=fmtDate(fromDt); currentUser.passTo=fmtDate(toDt); currentUser.passActive=true;
  const pIdx=PASSENGERS.findIndex(p=>p.id===currentUser.id); if(pIdx>=0){Object.assign(PASSENGERS[pIdx],currentUser);}
  syncPassengersToLS();
  alert(`✅ Payment Successful!\nAmount: ₹${pt.price}\nMethod: ${method}\nTransaction: ${txnId}\n\nDownloading receipt...`);
  await downloadReceiptPDF(payId);
  loadPage('p-payment');
}

function saveProfile(){
  const name=document.getElementById('profName')?.value;
  const phone=document.getElementById('profPhone')?.value;
  const city=document.getElementById('profCity')?.value;
  const age=document.getElementById('profAge')?.value;
  if(name)currentUser.name=name;
  if(phone)currentUser.phone=phone;
  if(city)currentUser.city=city;
  if(age)currentUser.age=parseInt(age);
  const pIdx=PASSENGERS.findIndex(p=>p.id===currentUser.id);
  if(pIdx>=0)Object.assign(PASSENGERS[pIdx],currentUser);
  syncPassengersToLS();
  document.getElementById('userName').textContent=currentUser.name;
  alert('✅ Profile saved!');

// ── Staff QR Scanner logic ──
let scannerStream=null, scannerAnimId=null, scannerActive=false;

function startQRScanner(){
  const video=document.getElementById('qrVideo');
  const placeholder=document.getElementById('scannerPlaceholder');
  const overlay=document.getElementById('scanOverlay');
  const startBtn=document.getElementById('startScannerBtn');
  const stopBtn=document.getElementById('stopScannerBtn');
  const statusMsg=document.getElementById('scannerStatusMsg');
  if(!video||scannerActive) return;

  // Load jsQR if not already loaded
  if(typeof jsQR==='undefined'){
    const script=document.createElement('script');
    script.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js';
    script.onload=()=>_initCamera(video,placeholder,overlay,startBtn,stopBtn,statusMsg);
    script.onerror=()=>{if(statusMsg)statusMsg.textContent='Failed to load QR library. Check internet connection.';};
    document.head.appendChild(script);
  } else {
    _initCamera(video,placeholder,overlay,startBtn,stopBtn,statusMsg);
  }
}

function _initCamera(video,placeholder,overlay,startBtn,stopBtn,statusMsg){
  if(statusMsg)statusMsg.textContent='Requesting camera permission…';

  // Use exact:environment to force back camera on mobile; fall back to plain 'environment'
  const tryCamera = (constraints) => navigator.mediaDevices.getUserMedia({video: constraints})
    .then(stream=>{
      scannerStream=stream;
      scannerActive=true;
      video.srcObject=stream;
      video.style.display='block';
      if(placeholder)placeholder.style.display='none';
      if(overlay)overlay.style.display='block';
      if(startBtn)startBtn.style.display='none';
      if(stopBtn)stopBtn.style.display='';
      if(statusMsg)statusMsg.textContent='📷 Back camera active — point at passenger QR code to scan.';
      video.play();
      _scanLoop(video);
    });

  // First try: force back/environment camera (exact constraint, strongest on mobile)
  tryCamera({facingMode:{exact:'environment'}})
    .catch(()=>{
      // Second try: prefer environment (less strict, allows desktop fallback)
      return tryCamera({facingMode:'environment'});
    })
    .catch(()=>{
      // Last resort: any available camera
      return tryCamera(true);
    })
    .catch(err=>{
      console.warn('Camera error:',err);
      if(statusMsg)statusMsg.textContent='⚠️ Camera access denied or unavailable. Allow camera permission and try again, or use manual entry below.';
      if(startBtn)startBtn.style.display='';
      if(stopBtn)stopBtn.style.display='none';
    });
}

function _scanLoop(video){
  const canvas=document.getElementById('qrCanvas');
  if(!canvas||!scannerActive) return;
  const ctx=canvas.getContext('2d');
  function tick(){
    if(!scannerActive) return;
    if(video.readyState===video.HAVE_ENOUGH_DATA){
      canvas.width=video.videoWidth;
      canvas.height=video.videoHeight;
      ctx.drawImage(video,0,0,canvas.width,canvas.height);
      try{
        const imgData=ctx.getImageData(0,0,canvas.width,canvas.height);
        if(typeof jsQR!=='undefined'){
          const code=jsQR(imgData.data,imgData.width,imgData.height,{inversionAttempts:'dontInvert'});
          if(code&&code.data){
            stopQRScanner();
            _handleScannedQR(code.data);
            return;
          }
        }
      }catch(e){}
    }
    scannerAnimId=requestAnimationFrame(tick);
  }
  scannerAnimId=requestAnimationFrame(tick);
}

function stopQRScanner(){
  scannerActive=false;
  if(scannerStream){scannerStream.getTracks().forEach(t=>t.stop());scannerStream=null;}
  if(scannerAnimId){cancelAnimationFrame(scannerAnimId);scannerAnimId=null;}
  const video=document.getElementById('qrVideo');
  const placeholder=document.getElementById('scannerPlaceholder');
  const overlay=document.getElementById('scanOverlay');
  const startBtn=document.getElementById('startScannerBtn');
  const stopBtn=document.getElementById('stopScannerBtn');
  const statusMsg=document.getElementById('scannerStatusMsg');
  if(video){video.style.display='none';video.srcObject=null;}
  if(placeholder)placeholder.style.display='block';
  if(overlay)overlay.style.display='none';
  if(startBtn)startBtn.style.display='';
  if(stopBtn)stopBtn.style.display='none';
  if(statusMsg)statusMsg.textContent='Scanner stopped.';
}

function _handleScannedQR(rawData){
  const statusMsg=document.getElementById('scannerStatusMsg');
  const result=document.getElementById('scanResult');
  if(statusMsg)statusMsg.textContent='QR detected! Processing…';

  let passNum=null, vtype='passenger', jsonData=null;

  // Step 1: Try the compact SmartTransit format — PASS:..|PID:..|NAME:..|FROM:..|TO:..|STATUS:..
  const compact=parseCompactQRData(rawData);
  if(compact&&(compact.PASS||compact.STAFF||compact.ADMIN)){
    if(compact.PASS){
      vtype='passenger'; passNum=compact.PASS;
      if(passNum&&!PASSENGERS.find(p=>p.passNumber===passNum)){
        PASSENGERS.push({
          id:compact.PID||'EXT1',
          name:compact.NAME||'Unknown',
          passNumber:passNum,
          passTypeName:'—',
          routeName:'—',
          route:'—',
          passFrom:compact.FROM||'',
          passTo:compact.TO||'',
          passActive:(compact.STATUS||'').toUpperCase()==='ACTIVE',
          phone:'',
          avatar:(compact.NAME||'?').split(' ').map(n=>n[0]).join('').substr(0,2).toUpperCase(),
          email:'',passType:'PT1',routeId:'R01',wallet:0,trips:0,
          joinDate:compact.FROM||'',
          fare:'—'
        });
      }
    } else if(compact.STAFF){
      vtype='staff'; passNum=compact.STAFF;
      if(passNum&&!STAFF.find(s=>s.id===passNum)){
        STAFF.push({id:passNum,name:compact.NAME||'Unknown',designation:compact.DESIGNATION||'—',zone:compact.ZONE||'—',shift:compact.SHIFT||'—',phone:'',email:'',joinDate:'',avatar:(compact.NAME||'?').split(' ').map(n=>n[0]).join('').substr(0,2).toUpperCase(),role:'staff',scansToday:0});
      }
    } else if(compact.ADMIN){
      vtype='admin'; passNum=compact.ADMIN;
    }
  } else {
    // Step 2: Legacy JSON format — kept only for backward compatibility with
    // previously generated/printed passes. The parsed data is always rendered
    // as the same formatted card below; the raw JSON text is never shown.
    try{
      const json=JSON.parse(rawData);
      jsonData=json;
      vtype=json.vtype||'passenger';
      passNum=json.passNo||json.pn||json.id||null;
      // Inject passenger into local data if not already present
      if(vtype==='passenger'&&passNum&&!PASSENGERS.find(p=>p.passNumber===passNum)){
        PASSENGERS.push({
          id:json.id||'EXT1',
          name:json.name||json.nm||'Unknown',
          passNumber:passNum,
          passTypeName:json.passType||json.pt||'—',
          routeName:json.routeName||json.rn||'—',
          route:json.route||json.rt||'—',
          passFrom:json.validFrom||json.fr||'',
          passTo:json.validTo||json.to||'',
          passActive:json.status==='ACTIVE'||(json.ac===true)||(json.validTo&&new Date(json.validTo)>=new Date()),
          phone:json.phone||json.ph||'',
          avatar:(json.name||json.nm||'?').split(' ').map(n=>n[0]).join('').substr(0,2).toUpperCase(),
          email:'',passType:'PT1',routeId:'R01',wallet:0,trips:0,
          joinDate:json.issueDate||json.iss||json.validFrom||'',
          fare:json.fare||'—'
        });
      }
    }catch(e){
      // Step 3: Legacy URL format
      try{
        const url=new URL(rawData);
        passNum=url.searchParams.get('validate');
        vtype=url.searchParams.get('vtype')||'passenger';
        const dParam=url.searchParams.get('d');
        if(dParam){
          try{
            const decoded=JSON.parse(decodeURIComponent(escape(atob(dParam))));
            jsonData=decoded;
            if(decoded.vtype==='passenger'&&!PASSENGERS.find(p=>p.passNumber===decoded.pn)){
              PASSENGERS.push({
                id:decoded.id||'EXT1',name:decoded.nm,passNumber:decoded.pn,passTypeName:decoded.pt,
                routeName:decoded.rn,route:decoded.rt||'—',passFrom:decoded.fr,passTo:decoded.to,
                passActive:decoded.ac,phone:decoded.ph||'',
                avatar:(decoded.nm||'?').split(' ').map(n=>n[0]).join('').substr(0,2).toUpperCase(),
                email:'',passType:'PT1',routeId:'R01',wallet:0,trips:0,joinDate:decoded.iss||''
              });
            }
          }catch(e2){}
        }
      }catch(e3){
        // Step 4: Treat as raw pass number
        passNum=rawData.trim();
      }
    }
  }

  if(!passNum){
    if(result)result.innerHTML=`<div style="padding:12px;background:rgba(240,85,96,0.08);border:1px solid rgba(240,85,96,0.2);border-radius:8px;color:var(--red);font-size:13px">❌ Could not read QR code data. Try manual entry.</div>`;
    if(statusMsg)statusMsg.textContent='⚠️ QR not recognised. Try again or use manual entry.';
    return;
  }

  if(statusMsg)statusMsg.textContent='✅ QR verified! Opening full verification…';

  // For staff/admin: open validation page immediately
  if(vtype!=='passenger'){
    openValidationPage(passNum, vtype);
    return;
  }

  // For passenger: find record and show full inline profile + open full page
  const passenger=PASSENGERS.find(p=>p.passNumber===passNum||p.passNumber.toLowerCase()===passNum.toLowerCase());
  if(!passenger){
    if(result)result.innerHTML=`<div style="padding:16px;background:rgba(240,85,96,0.08);border:1px solid rgba(240,85,96,0.2);border-radius:10px;color:var(--red);font-size:14px;font-weight:600">❌ PASS NOT FOUND — ${passNum}</div>`;
    if(statusMsg)statusMsg.textContent='❌ Pass not found in system.';
    return;
  }

  const active=passenger.passActive&&new Date(passenger.passTo)>=new Date();
  const pt=PASS_TYPES.find(x=>x.id===passenger.passType);
  const rt=ROUTES_DATA.find(x=>x.id===passenger.routeId);

  // Show complete passenger profile in scan result panel
  if(result)result.innerHTML=`
  <div style="background:linear-gradient(135deg,#1a2a5e,#0f1e45);border:2px solid rgba(${active?'68,212,128':'240,85,96'},0.5);border-radius:16px;padding:20px;margin-bottom:12px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div style="font-size:20px;font-weight:800;background:linear-gradient(90deg,#4f8ef7,#2ee8c0);-webkit-background-clip:text;-webkit-text-fill-color:transparent">SmartTransit</div>
      <span style="display:inline-block;background:rgba(${active?'68,212,128':'240,85,96'},0.15);border:1px solid rgba(${active?'68,212,128':'240,85,96'},0.5);color:var(--${active?'green':'red'});font-size:14px;font-weight:900;padding:5px 14px;border-radius:20px;letter-spacing:1px">${active?'● ACTIVE':'● EXPIRED'}</span>
    </div>
    <div style="display:flex;gap:12px;align-items:center;margin-bottom:14px">
      <div style="width:48px;height:48px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--purple));display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;flex-shrink:0">${passenger.avatar||passenger.name.split(' ').map(n=>n[0]).join('').substr(0,2).toUpperCase()}</div>
      <div>
        <div style="font-size:17px;font-weight:700;color:#fff">${passenger.name}</div>
        <div style="font-size:11px;color:rgba(255,255,255,0.45);font-family:monospace">Pass: ${passenger.passNumber}</div>
        <div style="font-size:11px;color:rgba(255,255,255,0.4)">ID: ${passenger.id}</div>
      </div>
    </div>
    ${[
      ['Pass Type',passenger.passTypeName],
      ['Route No.',rt?.num||passenger.route||'—'],
      ['Route Name',passenger.routeName||'—'],
      ['Fare','₹'+(pt?.price||passenger.fare||'—')],
      ['Issue Date',fmtDateDisp(passenger.joinDate||passenger.passFrom)],
      ['Valid From',fmtDateDisp(passenger.passFrom)],
      ['Expiry Date',fmtDateDisp(passenger.passTo)],
      ['Phone',passenger.phone||'—'],
      ['Status',active?'🟢 ACTIVE':'🔴 EXPIRED'],
      ['Verified At',new Date().toLocaleString('en-IN')]
    ].map(([l,v])=>`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(79,142,247,0.12);font-size:12px"><span style="color:rgba(255,255,255,0.4)">${l}</span><span style="color:#fff;font-weight:600;text-align:right;max-width:55%">${v}</span></div>`).join('')}
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn-sm btn-accent" style="flex:1" onclick="openValidationPage('${passenger.passNumber}')"><i class="ti ti-external-link"></i> Full Verification Page</button>
      <button class="btn-sm" style="flex:1" onclick="currentValidationPassNum='${passenger.passNumber}';currentValidationType='passenger';downloadValidationPDF()"><i class="ti ti-download"></i> PDF</button>
    </div>
  </div>`;

  if(statusMsg)statusMsg.textContent='✅ Pass scanned & verified successfully!';
}

function savePassenger(editId){
  const name=document.getElementById('mpName').value.trim();
  const email=document.getElementById('mpEmail').value.trim();
  const phone=document.getElementById('mpPhone').value.trim();
  const pass=document.getElementById('mpPass').value;
  const ptId=document.getElementById('mpPassType').value;
  const rtId=document.getElementById('mpRoute').value;
  const from=document.getElementById('mpFrom').value;
  const to=document.getElementById('mpTo').value;
  if(!name||!email){alert('Name and email required');return;}
  const pt=PASS_TYPES.find(x=>x.id===ptId)||PASS_TYPES[0];
  const rt=ROUTES_DATA.find(x=>x.id===rtId)||ROUTES_DATA[0];
  if(editId){
    const idx=PASSENGERS.findIndex(x=>x.id===editId);
    if(idx>=0){Object.assign(PASSENGERS[idx],{name,email,phone,password:pass,passType:ptId,passTypeName:pt.name,routeId:rtId,route:rt.num,routeName:rt.name,passFrom:from,passTo:to,passActive:new Date(to)>=new Date()});USERS_DB[email]=PASSENGERS[idx];}
  } else {
    const np={id:'P'+(PASSENGERS.length+1),name,email,phone,password:pass,role:'passenger',avatar:(name.split(' ').map(n=>n[0]).join('').substr(0,2).toUpperCase()),passNumber:generatePassNumber(),passType:ptId,passTypeName:pt.name,routeId:rtId,route:rt.num,routeName:rt.name,passFrom:from,passTo:to,passActive:new Date(to)>=new Date(),wallet:500,trips:0,joinDate:fmtDate(new Date())};

  }

}

  const dur=parseInt(document.getElementById('aptDur').value)||30;
  const price=parseInt(document.getElementById('aptPrice').value)||600;
  const trips=document.getElementById('aptTrips').value||'Unlimited';
  if(!name){alert('Pass name required');return;}
  PASS_TYPES.push({id:'PT'+(PASS_TYPES.length+1),name,duration:dur,price,trips,color:'#4f8ef7'});
  closeModal(); loadPage('a-passes');
}

function editRouteModal(id){
  const r=ROUTES_DATA.find(x=>x.id===id); if(!r)return;
  showModal(`<div class="modal-title">Edit Route ${r.num}<button class="modal-close" onclick="closeModal()">✕</button></div>
<div class="form-row"><div class="form-group"><label class="form-label">Route Number</label><input class="form-input" id="arNum" value="${r.num}"></div><div class="form-group"><label class="form-label">Fare (₹)</label><input class="form-input" type="number" id="arFare" value="${r.fare}"></div></div>
<div class="form-row"><div class="form-group"><label class="form-label">From</label><input class="form-input" id="arFrom" value="${r.from}"></div><div class="form-group"><label class="form-label">To</label><input class="form-input" id="arTo" value="${r.to}"></div></div>
<div class="form-group"><label class="form-label">Stops</label><input class="form-input" id="arStops" value="${r.stops.join(', ')}"></div>
<div class="form-row"><div class="form-group"><label class="form-label">Frequency</label><input class="form-input" id="arFreq" value="${r.freq}"></div><div class="form-group"><label class="form-label">Distance (km)</label><input class="form-input" type="number" id="arKm" value="${r.km}"></div></div>
<button class="btn-sm btn-accent" style="width:100%;justify-content:center;margin-top:8px" onclick="saveRoute('${id}')"><i class="ti ti-check"></i> Update Route</button>`);
}
function saveRoute(editId){
  const num=document.getElementById('arNum').value.trim();
  const fare=parseInt(document.getElementById('arFare').value)||30;
  const from=document.getElementById('arFrom').value.trim();
  const to=document.getElementById('arTo').value.trim();
  const stops=document.getElementById('arStops').value.split(',').map(s=>s.trim()).filter(Boolean);
  const freq=document.getElementById('arFreq').value.trim();
  const km=parseFloat(document.getElementById('arKm').value)||20;
  if(!num||!from||!to){alert('Route number, From, and To are required');return;}
  const name=`${from} – ${to}`;
  if(editId){const idx=ROUTES_DATA.findIndex(x=>x.id===editId);if(idx>=0)Object.assign(ROUTES_DATA[idx],{num,name,from,to,stops,freq,fare,km});}
  else ROUTES_DATA.push({id:'R'+String(ROUTES_DATA.length+1).padStart(2,'0'),num,name,from,to,stops,freq,fare,km,status:'active'});
  closeModal(); loadPage('a-routes');
}

    <div style="font-size:13px;font-weight:700;color:var(--blue);margin-bottom:14px">Route Map — ${rt?.name||passenger.routeName||'—'}</div>
    <div style="overflow-x:auto;padding-bottom:4px">
      <div style="display:flex;align-items:center;gap:0;min-width:max-content;padding:4px 0">
        ${routeStops.map((stop,i)=>`
          <div style="display:flex;align-items:center;gap:0">
            <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
              <div style="width:${i===0||i===routeStops.length-1?'14px':'10px'};height:${i===0||i===routeStops.length-1?'14px':'10px'};border-radius:50%;background:${i===0||i===routeStops.length-1?'var(--teal)':'var(--blue)'};border:2px solid ${i===0||i===routeStops.length-1?'var(--teal)':'rgba(79,142,247,0.6)'};flex-shrink:0"></div>
              <div style="font-size:9px;color:var(--text2);max-width:60px;text-align:center;line-height:1.2">${stop}</div>
            </div>
            ${i<routeStops.length-1?`<div style="width:28px;height:2px;background:rgba(79,142,247,0.35);margin-bottom:14px;flex-shrink:0"></div>`:''}
          </div>
        `).join('')}
      </div>
    </div>
    ${rt?`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px">
      <div style="text-align:center;background:var(--bg3);border-radius:8px;padding:8px"><div style="font-size:9px;color:var(--text3)">Frequency</div><div style="font-size:12px;font-weight:700;margin-top:2px">${rt.freq}</div></div>
      <div style="text-align:center;background:var(--bg3);border-radius:8px;padding:8px"><div style="font-size:9px;color:var(--text3)">Distance</div><div style="font-size:12px;font-weight:700;margin-top:2px">${rt.km} km</div></div>
      <div style="text-align:center;background:var(--bg3);border-radius:8px;padding:8px"><div style="font-size:9px;color:var(--text3)">Fare</div><div style="font-size:12px;font-weight:700;margin-top:2px">₹${rt.fare}</div></div>
    </div>`:''}
  </div>

  <div style="padding:10px;background:rgba(${active?'68,212,128':'240,85,96'},0.08);border:1px solid rgba(${active?'68,212,128':'240,85,96'},0.2);border-radius:8px;text-align:center;font-size:12px;color:var(--${active?'green':'red'});font-weight:600">
    ${active?'✅ This pass is valid and authorised for travel on the specified route.':'❌ This pass has expired. Passenger must renew before boarding.'}
  </div>`;
  showPage();
}

// Check URL for validation parameter on load (legacy URL-based QR support)
function checkValidationURL(){
  const params=new URLSearchParams(location.search);
  const passNum=params.get('validate');
  const vtype=params.get('vtype')||'passenger';
  if(!passNum) return;

  // Try to decode embedded JSON data first (self-contained QR)
  const dParam=params.get('d');
  if(dParam){
    try{
      const decoded=JSON.parse(decodeURIComponent(escape(atob(dParam))));
      // Inject/update PASSENGERS if passenger type
      if(decoded.vtype==='passenger'&&!PASSENGERS.find(p=>p.passNumber===(decoded.passNo||decoded.pn))){
        PASSENGERS.push({
          id:decoded.id||'EXT1',
          name:decoded.name||decoded.nm,
          passNumber:decoded.passNo||decoded.pn,
          passTypeName:decoded.passType||decoded.pt,
          routeName:decoded.routeName||decoded.rn,
          route:decoded.route||decoded.rt||'—',
          passFrom:decoded.validFrom||decoded.fr,
          passTo:decoded.validTo||decoded.to,
          passActive:decoded.status==='ACTIVE'||(decoded.ac===true)||(decoded.validTo&&new Date(decoded.validTo)>=new Date()),
          phone:decoded.phone||decoded.ph||'',
          avatar:(decoded.name||decoded.nm||'?').split(' ').map(n=>n[0]).join('').substr(0,2).toUpperCase(),
          email:'',passType:'PT1',routeId:'R01',wallet:0,trips:0,
          joinDate:decoded.issueDate||decoded.iss||decoded.validFrom||'',
          fare:decoded.fare||'—'
        });
      }
      // For staff injected from external QR
      if(decoded.vtype==='staff'&&!STAFF.find(s=>s.id===decoded.id)){
        STAFF.push({id:decoded.id,name:decoded.name||decoded.nm,designation:decoded.designation||decoded.des,zone:decoded.zone,shift:decoded.shift,phone:decoded.phone||decoded.ph||'',email:decoded.email||'',joinDate:decoded.join||'',avatar:(decoded.name||decoded.nm||'?').split(' ').map(n=>n[0]).join('').substr(0,2).toUpperCase(),role:'staff',scansToday:0});
      }
    }catch(e){console.warn('QR data decode error:',e);}
  }

  document.getElementById('authScreen').style.display='none';
  openValidationPage(decodeURIComponent(passNum), vtype);
}

// ══════════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════════
function filterTable(input,tableId){
  const val=input.value.toLowerCase();
  const table=document.getElementById(tableId);
  if(!table)return;
  table.querySelectorAll('tr:not(:first-child)').forEach(row=>{
    row.style.display=row.textContent.toLowerCase().includes(val)?'':'none';
  });
}

// ══════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════
// ── SESSION RESTORE (passenger-dashboard) ──
(function bootPassenger(){
  loadFromLS();
  // Check URL-based QR validation first
  const params=new URLSearchParams(location.search);
  if(params.get('validate')){checkValidationURL();return;}
  // Restore session
  try{
    const session=JSON.parse(localStorage.getItem('st_session')||'null');
    if(session&&session.role==='passenger'){
      // Merge any LS updates into USERS_DB so currentUser is fresh
      const lsPassengers=JSON.parse(localStorage.getItem('st_passengers')||'null');
      if(lsPassengers){const found=lsPassengers.find(p=>p.email===session.email);if(found)Object.assign(session,found);}
      loginUser(session);
      return;
    }
  }catch(e){}
  // No valid session → redirect to passenger login
  window.location.href='passenger-login.html';
})();

// After route map page loads, trigger update
document.addEventListener('DOMContentLoaded',()=>{
  setTimeout(()=>{
    const sel=document.getElementById('mapRouteSelect');
    if(sel)updateRouteMap(sel.value);
  },200);
});
